<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sine Start</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
    
</head>

<body>
    <canvas id="canvas"></canvas>

    <div id="controls">
        <label>Divergence Angle</label>
        <select id="ctrl-divergence">
            <option value="137.1">137.1</option>
            <option value="137.3">137.3</option>
            <option value="137.5" selected>137.5</option>
            <option value="137.7">137.7</option>
            <option value="137.7">137.9</option>
        </select>
        <button id="btn-restart">Restart App</button>
    </div>

    <script>
        "use strict";
        const canvasWidth = 400, canvasHeight = 300;
        let ctx;
        let n = 0;
        const fps = 30;
        let divergence = 137.5;
        let c = 4;
        let radius = 2;
        let control = document.querySelector("#ctrl-divergence");
        control.addEventListener('change', (e) => {
            let value = Number(e.target.value);
            divergence = value;
        });

        let restartButton = document.querySelector("#btn-restart");
        restartButton.addEventListener("click", () => {
            ctx.fillStyle = "black";
            ctx.fillRect(0,0,canvasWidth,canvasHeight);
            n = 0;
        });


        window.onload = init;
        function init() {
            ctx = canvas.getContext("2d");
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            loop();
        }

        const loop = () => {
            setTimeout(loop, 1000 / fps);
            let a = n * dtr(divergence);
            let r = c * Math.sqrt(n);
            // console.log(a, r);
            let x = r * Math.cos(a) + canvasWidth / 2;
            let y = r * Math.sin(a) + canvasHeight / 2;
            // console.log(x,y);

            // let color = `rgb(${n % 256},0,255)`;
            // let color = `rgb(${n % 256},0,255)`;
            let color = `hsl(${n / 5 % 361},100%,50%)`;
            drawCircle(ctx, x, y, radius, color);

            n++;
            c += 0.01;
            radius *= 1.001;
        }

        // helpers
        function dtr(degrees) {
            return degrees * (Math.PI / 180);
        }

        function drawCircle(ctx, x, y, radius, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }


        

    </script>
</body>

</html>
